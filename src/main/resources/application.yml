server:
  port: 8088

spring:
  application:
    name: teamfiles
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.elasticsearch.ElasticsearchClientAutoConfiguration
      - org.springframework.boot.autoconfigure.elasticsearch.ReactiveElasticsearchClientAutoConfiguration
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/teamfiles?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:123456}
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
      continue-on-error: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
      password: ${REDIS_PASSWORD:}
      database: 0
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5
    elasticsearch:
      repositories:
        enabled: false
  elasticsearch:
    uris: ${ES_URIS:http://localhost:9200}
    connection-timeout: 5s
    socket-timeout: 30s
  servlet:
    multipart:
      max-file-size: 5GB
      max-request-size: 5GB
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

# JWT
jwt:
  secret: ${JWT_SECRET:teamfiles-jwt-secret-key-2026-must-be-at-least-256-bits-long}
  expiration: 1800
  remember-expiration: 604800

# File Storage
file:
  storage:
    base-path: ${FILE_STORAGE_PATH:./data/files}
    chunk-path: ${FILE_CHUNK_PATH:./data/chunks}
    backup-path: ${FILE_BACKUP_PATH:./data/backups}
  chunk-size: 5242880

# AI
ai:
  encrypt:
    secret-key: ${AI_ENCRYPT_KEY:teamfiles-aes-key-256bit-padding!}

# Knife4j
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
knife4j:
  enable: true
  setting:
    language: zh-CN

# Logging
logging:
  level:
    root: info
    com.myself.teamfiles: debug
